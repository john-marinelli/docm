<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; worker-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
  <title>docm</title>
</head>
<body>
  <header class="preview-header">
    <div class="document-heading">
      <h1 id="source-title">docm</h1>
      <span class="document-subtitle">Live PDF preview</span>
    </div>
    <div class="toolbar" role="toolbar" aria-label="PDF reading controls">
      <div class="control-group" role="group" aria-label="Page navigation">
        <button id="previous-page" type="button" aria-label="Previous page" title="Previous page" disabled>Previous</button>
        <label class="page-label" for="page-number">Page</label>
        <input id="page-number" type="number" min="1" value="1" inputmode="numeric" aria-label="Page number" disabled>
        <span id="page-count">of 0</span>
        <button id="next-page" type="button" aria-label="Next page" title="Next page" disabled>Next</button>
        <span id="page-indicator" class="visually-hidden" role="status" aria-label="Page indicator">No pages</span>
      </div>
      <div class="control-group" role="group" aria-label="Zoom controls">
        <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out" disabled>−</button>
        <output id="zoom-percentage" aria-label="Zoom percentage">100%</output>
        <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in" disabled>+</button>
        <button id="fit-width" type="button" aria-pressed="true" disabled>Fit width</button>
        <button id="fit-page" type="button" aria-pressed="false" disabled>Fit page</button>
      </div>
      <button id="export-pdf" class="primary-button" type="button" title="Export PDF (⌘S)" disabled>Export PDF</button>
    </div>
    <div id="preview-status" class="preview-status" role="status" aria-live="polite" aria-atomic="true" data-kind="rendering">
      <span id="status-message">Rendering document…</span>
      <span id="source-diagnostic" hidden></span>
    </div>
    <div id="export-status" class="export-status" role="status" aria-live="polite" hidden></div>
  </header>
  <main class="workspace" aria-label="Document preview">
    <div id="viewer-container" tabindex="0" role="region" aria-label="PDF pages" aria-busy="true">
      <div id="pdf-viewer" class="pdfViewer"></div>
    </div>
    <div id="empty-state" class="empty-state">
      <h2 id="empty-title">Rendering document…</h2>
      <p id="empty-message">The generated PDF will appear here when it is ready.</p>
    </div>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>

[tools]
node = "26.10.0"
pnpm = "12.10.1"

[tasks.dev]
run = "pnpm run dev"
[tasks.build]
run = "pnpm run build"
[tasks.typecheck]
run = "pnpm run typecheck"
[tasks.test]
run = "pnpm run test"
[tasks."notices:prepare"]
run = "pnpm run notices:prepare"
[tasks.package]
run = "pnpm run package"
[tasks."package:linux"]
run = "pnpm run package:linux"
[tasks.smoke]
depends = ["build"]
run = "pnpm run smoke"
[tasks."build:smoke"]
run = "pnpm run build:smoke"
[tasks."package:smoke"]
run = "pnpm run package:smoke"
[tasks."formula:build"]
run = "pnpm run formula:build"
[tasks."formula:prepare"]
run = "pnpm run formula:prepare"
[tasks."formula:install"]
depends = ["formula:prepare"]
run = "pnpm run formula:install"
[tasks."formula:refresh"]
run = "pnpm run formula:refresh"
[tasks."formula:smoke"]
run = "pnpm run formula:smoke"

[tasks."bootstrap:electron"]
run = "pnpm run bootstrap:electron"

[tasks."release:version"]
run = "pnpm run release:version"
[tasks."release:check"]
run = "pnpm run release:check"
[tasks."release:prepare"]
run = "pnpm run release:prepare"
[tasks."release:merge"]
run = "pnpm run release:merge"
[tasks."release:smoke"]
run = "pnpm run release:smoke"
[tasks."release:homebrew"]
run = "pnpm run release:homebrew"
[tasks."release:github"]
run = "pnpm run release:github"

[tasks."ci:display"]
run = "node scripts/with-display.mjs"
[tasks."ci:homebrew"]
run = "node scripts/ci-homebrew.mjs"
[tasks."ci:linux:prepare"]
run = """
set -eu
test "${GITHUB_ACTIONS:-}" = true
sudo apt-get update
sudo apt-get install -y --no-install-recommends xvfb xauth xdg-utils libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libatk-bridge2.0-0t64 libdrm2
sudo apparmor_parser -r scripts/ci-apparmor.profile
export PATH="/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:$PATH"
printf '%s\\n' /home/linuxbrew/.linuxbrew/bin /home/linuxbrew/.linuxbrew/sbin >> "$GITHUB_PATH"
command -v brew
"""

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Install Linux build and packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev rpm
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Package
        run: scripts/package.sh
      - name: Install the .deb and render without a display
        if: runner.os == 'Linux'
        run: scripts/package-check.sh deb dist
      - name: Install the .rpm on Fedora and openSUSE
        if: runner.os == 'Linux'
        run: scripts/package-check.sh rpm dist
      - name: Install through Homebrew
        run: scripts/brew-check.sh dist

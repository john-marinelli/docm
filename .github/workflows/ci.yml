name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          electron: "true"
      - name: Prepare Linux graphical runtime
        if: runner.os == 'Linux'
        run: mise run ci:linux:prepare
      - name: Check types
        run: mise run typecheck
      - name: Run behavior tests
        run: mise run test
      - name: Build fresh source without mise on PATH
        env:
          MISE_AUTO_INSTALL: "false"
        run: mise run ci:display -- mise run build:smoke
      - name: Install and exercise the Linuxbrew candidate
        if: runner.os == 'Linux'
        run: mise run ci:display -- mise run ci:homebrew
      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-evidence-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/build-smoke/
            .build/release-homebrew/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

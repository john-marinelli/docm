name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          electron: "true"
      - name: Check the tag matches package.json and is on main
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install Linux packaging and display tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm xvfb xauth
          sudo apparmor_parser -r scripts/ci-apparmor.profile
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Check types and behavior
        run: pnpm run typecheck && pnpm run test
      - name: Package
        run: pnpm run package
      - name: Exercise the packaged app
        if: runner.os == 'macOS'
        run: pnpm run package:smoke
      - name: Install the .deb and exercise it
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/docm-*-linux-x64.deb
          xvfb-run -a node scripts/smoke.mjs --executable /usr/bin/docm
      - name: Install through Homebrew
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} scripts/brew-check.sh dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/docm-*.tar.gz
            dist/docm-*.deb
            dist/docm-*.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
        with:
          dependencies: "false"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum docm-* > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "docm ${GITHUB_REF_NAME#v}" --generate-notes
      - name: Propose the formula update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/formula.mjs dist --release "$GITHUB_REPOSITORY" > Formula/docm.rb
          branch="homebrew/$GITHUB_REF_NAME"
          git switch -c "$branch"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -am "chore(homebrew): docm ${GITHUB_REF_NAME#v}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Homebrew: docm ${GITHUB_REF_NAME#v}" \
            --body "Points the formula at the [$GITHUB_REF_NAME release](https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME). The release workflow installed these archives through Homebrew on macOS arm64 and Linux x64 before publishing."

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
  queue: max

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Resolve the tagged source commit
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate release source and tag
        env:
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          git diff --exit-code
          git diff --cached --exit-code
          mise run release:check -- "$RELEASE_TAG"
          mise run release:github -- preflight
      - name: Check types and behavior
        run: mise run typecheck && mise run test
      - name: Prepare versioned release assets and formula
        env:
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        shell: bash
        run: mise run release:prepare -- --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --repository "$GITHUB_REPOSITORY"
      - name: Build and exercise the exact candidate assets
        run: mise run release:smoke
      - name: Retain immutable release candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-candidate
          path: .build/release/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Retain source-build evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-source-evidence-${{ github.run_attempt }}
          path: .build/release-smoke/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  publish:
    needs: build
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          dependencies: "false"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-candidate
          path: .build/release
      - name: Upload draft assets, then publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run release:github -- publish

  verify-public:
    needs: [build, publish]
    runs-on: macos-14
    timeout-minutes: 40
    env:
      RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-candidate
          path: .build/release
      - name: Verify unauthenticated public downloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run release:github -- verify-public
      - name: Install public candidate and exercise the installed CLI
        run: mise run release:homebrew -- --directory .build/release-public
      - name: Retain installation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-homebrew-evidence-${{ github.run_attempt }}
          path: .build/release-homebrew/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  formula-pr:
    needs: [build, verify-public]
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          dependencies: "false"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-candidate
          path: .build/release
      - name: Propose the formula update and dispatch its CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run release:github -- pull-request
